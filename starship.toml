format = """
[](#3B4252)\
$username\
[](bg:#434C5E fg:#3B4252)\
$directory\
[](fg:#434C5E bg:#4C566A)\
$git_branch\
$git_status\
[](fg:#4C566A bg:#86BBD8)\
$c\
$elixir\
$elm\
$golang\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$typst\
[](fg:#86BBD8 bg:#06969A)\
$docker_context\
[](fg:#06969A bg:#33658A)\
$time\
[ ](fg:#33658A)\
"""
command_timeout = 5000
# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like  to save some space
[username]
show_always = true
style_user = "bg:#3B4252"
style_root = "bg:#3B4252"
format = '[$user ]($style)'

[directory]
style = "bg:#434C5E"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = "  "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important  " = "  "

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

[battery]
full_symbol = '🔋 '
charging_symbol = '⚡️ '
discharging_symbol = '💀 '

[[battery.display]]
threshold = 100

style = 'bold red'


[c]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#06969A"
format = '[ $symbol $context ]($style) $path'

[elixir]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#4C566A"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#4C566A"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#33658A"
format = '[ $time ]($style)'

[typst]
disabled = false
symbol = 't '
style = 'bold #0093A7'
detect_extensions = ['.typ']
version_format = 'v${raw}'
format = '[ $symbol ($version) ]($style)'

# Configure the custom weather module
#[custom.weather]
#when = "true"                                 # Always show this module
##interval = 900                                # Update every 15 minutes (in seconds)
#symbol = ""                                   # Optional symbol
#style = "bg:#33658A"                         # Style the module
#format = "[$output]($style)"  
#command = "curl -s 'wttr.in?format=%c%t'"     # Command to fetch weather information (icon and temperature)

[custom.filecounter]
command = "ls -A | wc -l"              # Command to count the number of files in the current directory
when = "true"                                 # Always show this module
#interval = 60                               # Update every hour (in seconds)
symbol = "📁 "                                  # Optional symbol (folder icon)
style = "bg:#33658A"                         # Style the module
format = "[ $symbol$output ]($style)"           # Format the output with the symbol and

[custom.random]
command = "bash ~/BashProjects/UsefulBashScripts/starshipRandomizer.sh"              # Command to fetch a random quote
when = "true"                                 # Always show this module
#interval = 60                               # Update every hour (in seconds)
symbol = "❝"                                  # Optional symbol (opening quotation mark)
style = "bg:#33658A"                         # Style the module
format = "[ $symbol$output❞]($style)"           # Format the output with the symbol and style
